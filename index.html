<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driving Sim · Jev Autopilot</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud">
      <div id="telemetry" class="panel">
        <div class="row"><span>SPEED</span><b id="t-spd">0</b><i>km/h</i></div>
        <div class="row"><span>LIGHT</span><b id="t-light">–</b><i></i></div>
        <div class="row"><span>NEXT</span><b id="t-next">–</b><i></i></div>
        <div class="row"><span>DIST</span><b id="t-dist">0</b><i>m</i></div>
        <div class="row"><span>PHASE</span><b id="t-phase">ready</b><i></i></div>
        <div class="row"><span>RED RUN</span><b id="t-reds">0</b><i></i></div>
      </div>

      <canvas id="minimap" width="200" height="200"></canvas>

      <div id="center-msg"></div>

      <div id="mode-panel" class="panel">
        <div id="mode-title">MANUAL</div>
        <div class="hint">
          <b>J</b> Jev autopilot · <b>R</b> reset<br />
          <b>W</b> gas · <b>S</b> brake · <b>A/D</b> steer<br />
          map seed <b id="seed">–</b> · refresh for a new city
        </div>
        <div id="jev" hidden>
          <div class="jev-head"><span class="dot"></span> Jev · <span id="jev-latency">–</span> ms · <span id="jev-tokens">–</span> tok</div>
          <div id="jev-answers"></div>
          <div id="jev-stats"></div>
        </div>
      </div>

      <div id="rc">
        <div class="rc-top"><span class="rc-brand">DRIVER</span><span class="rc-mode">RHD TRAFFIC · AUTO GEARBOX</span><span class="rc-led" id="rc-led"></span></div>
        <div class="rc-body">
          <div class="wheel-wrap">
            <div id="wheel"><div class="spoke s1"></div><div class="spoke s2"></div><div class="spoke s3"></div><div class="hub"></div><div class="top-mark"></div></div>
          </div>
          <div class="pedals">
            <div class="pedal"><div class="pedal-track"><div class="pedal-fill brk" id="pedal-brk"></div></div><span>BRAKE</span></div>
            <div class="pedal"><div class="pedal-track"><div class="pedal-fill thr" id="pedal-thr"></div></div><span>GAS</span></div>
          </div>
        </div>
        <div class="rc-readout"><span>STEER <b id="rc-s">0.00</b></span><span>GAS <b id="rc-t">0.00</b></span><span>BRAKE <b id="rc-b">0.00</b></span></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
